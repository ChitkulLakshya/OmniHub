<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors | OmniHub 24</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="game-page">
    <div class="container">
        <nav class="game-nav">
            <a href="../../index.html" class="back-link">
                <i data-lucide="chevron-left"></i> Back to Arcade
            </a>
        </nav>

        <main class="game-container">
            <header class="game-header">
                <h1>Rock Paper Scissors</h1>
                <div class="score-board">
                    <div class="score-card cyan">
                        <span class="label">Player</span>
                        <span class="value" id="player-score">0</span>
                    </div>
                    <div class="score-card purple">
                        <span class="label">Machine</span>
                        <span class="value" id="ai-score">0</span>
                    </div>
                </div>
            </header>

            <div class="rps-arena">
                <div class="slot" id="player-slot">
                    <div class="choice-display glass">
                        <i data-lucide="help-circle"></i>
                    </div>
                    <span>YOU</span>
                </div>
                <div class="vs">VS</div>
                <div class="slot" id="ai-slot">
                    <div class="choice-display glass">
                        <i data-lucide="help-circle"></i>
                    </div>
                    <span>CPU</span>
                </div>
            </div>

            <div class="result-msg" id="result">Pick your weapon</div>

            <div class="controls">
                <button class="choice-btn" data-choice="rock">
                    <i data-lucide="mountain"></i>
                    <span>ROCK</span>
                </button>
                <button class="choice-btn" data-choice="paper">
                    <i data-lucide="file-text"></i>
                    <span>PAPER</span>
                </button>
                <button class="choice-btn" data-choice="scissors">
                    <i data-lucide="scissors"></i>
                    <span>SCISSORS</span>
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
