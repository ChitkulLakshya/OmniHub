<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Skyline Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="game-page">
    <div class="container">
        <nav class="game-nav">
            <a href="../../index.html" class="back-link">
                <i data-lucide="chevron-left"></i> Back to Arcade
            </a>
        </nav>

        <main class="game-container">
            <header class="game-header">
                <h1>Tic-Tac-Toe</h1>
                <div class="score-board">
                    <div class="score-card cyan">
                        <span class="label">Player X</span>
                        <span class="value" id="score-x">0</span>
                    </div>
                    <div class="score-card pink">
                        <span class="label">Player O</span>
                        <span class="value" id="score-o">0</span>
                    </div>
                </div>
            </header>

            <div class="status-box">
                <p id="status">Player X's Turn</p>
            </div>

            <div class="ttt-grid" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="game-controls">
                <button id="reset-btn" class="neon-btn">
                    <i data-lucide="rotate-ccw"></i> Reset Match
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
