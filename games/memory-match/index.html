<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match | OmniHub 24</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="game-page">
    <div class="container">
        <nav class="game-nav">
            <a href="../../index.html" class="back-link">
                <i data-lucide="chevron-left"></i> Back to Arcade
            </a>
        </nav>

        <main class="game-container">
            <header class="game-header">
                <h1>Memory Match</h1>
                <div class="score-board">
                    <div class="score-card pink">
                        <span class="label">Moves</span>
                        <span class="value" id="moves">0</span>
                    </div>
                    <div class="score-card cyan">
                        <span class="label">Time</span>
                        <span class="value" id="timer">00:00</span>
                    </div>
                </div>
            </header>

            <div class="memory-grid" id="grid">
                <!-- Cards will be generated by JS -->
            </div>

            <div class="game-controls">
                <button id="reset-btn" class="neon-btn pink">
                    <i data-lucide="rotate-ccw"></i> Restart
                </button>
            </div>
        </main>
    </div>

    <div id="win-overlay" class="overlay hidden">
        <div class="win-content">
            <i data-lucide="trophy" class="trophy-icon"></i>
            <h2>MATCH COMPLETE!</h2>
            <p id="final-stats">Moves: 0 | Time: 00:00</p>
            <button id="play-again" class="neon-btn pink">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
